# Only display the OSD on the currently focused monitor
$osdclient = swayosd-client --monitor "$(monarch-hyprland-monitor-focused)"

# Laptop multimedia keys for volume and LCD brightness (with OSD)
bindeld = ,XF86AudioRaiseVolume, Volume up, exec, monarch-swayosd-client --output-volume raise
bindeld = ,XF86AudioLowerVolume, Volume down, exec, monarch-swayosd-client --output-volume lower
bindeld = ,XF86AudioMute, Mute, exec, monarch-swayosd-client --output-volume mute-toggle
bindeld = ,XF86AudioMicMute, Mute microphone, exec, monarch-audio-input-mute
bindeld = ,XF86MonBrightnessUp, Brightness up, exec, monarch-brightness-display +5%
bindeld = ,XF86MonBrightnessDown, Brightness down, exec, monarch-brightness-display 5%-
bindeld = ,XF86KbdBrightnessUp, Keyboard brightness up, exec, monarch-brightness-keyboard up
bindeld = ,XF86KbdBrightnessDown, Keyboard brightness down, exec, monarch-brightness-keyboard down
bindld = ,XF86KbdLightOnOff, Keyboard backlight cycle, exec, monarch-brightness-keyboard cycle
bindld = ,XF86TouchpadToggle, Toggle touchpad, exec, monarch-toggle-touchpad
bindld = ,XF86TouchpadOn, Enable touchpad, exec, monarch-toggle-touchpad on
bindld = ,XF86TouchpadOff, Disable touchpad, exec, monarch-toggle-touchpad off


# Precise 1% multimedia adjustments with Alt modifier
bindeld = ALT, XF86AudioRaiseVolume, Volume up precise, exec, monarch-swayosd-client --output-volume +1
bindeld = ALT, XF86AudioLowerVolume, Volume down precise, exec, monarch-swayosd-client --output-volume -1
bindeld = ALT, XF86MonBrightnessUp, Brightness up precise, exec, monarch-brightness-display +1%
bindeld = ALT, XF86MonBrightnessDown, Brightness down precise, exec, monarch-brightness-display -1%

# Requires playerctl
bindld = , XF86AudioNext, Next track, exec, monarch-swayosd-client --playerctl next
bindld = , XF86AudioPause, Pause, exec, monarch-swayosd-client --playerctl play-pause
bindld = , XF86AudioPlay, Play, exec, monarch-swayosd-client --playerctl play-pause
bindld = , XF86AudioPrev, Previous track, exec, monarch-swayosd-client --playerctl previous
# Switch audio output with Super + Mute
bindld = SUPER, XF86AudioMute, Switch audio output, exec, monarch-audio-output-switch
