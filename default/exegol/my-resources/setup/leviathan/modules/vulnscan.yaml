name: Vuln scan

params:
  - nucleiThreads: "200"

reports:
  - "{{.Workspace}}/reports/vulns/"

steps:
  - requirements:
    - nuclei
    - "{{.targetfile}}"
    commands:
      - MarkdownExportSortMode=severity nuclei -silent -l {{.targetfile}} -c c {{.nucleiThreads}} -irr -me {{.TempDir}}/vulns

post_run:
  - ExecCmd("mdcat {{.TempDir}}/vulns/index.md {{.TempDir}}/vulns/summary.txt")
  - CopyDir("{{.TempDir}}/vulns", "{{.Workspace}}/reports/vulns/")
