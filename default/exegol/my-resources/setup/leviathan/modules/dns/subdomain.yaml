name: Subdomain
description: Retrieve subdomains

reports:
  - "{{.Workspace}}/reports/dns/"  

pre_run:
  - CreateFolder("{{.Workspace}}/reports/dns/")

steps:
  - requirements:
      - subfinder
    commands:
      - subfinder -d "{{.Target}}" -o "{{.TempDir}}/subfinder.txt"

  - requirements:
      - alterx
    commands:
      - alterx -l "{{.Target}}" -o "{{.TempDir}}/alterx.txt"

  - requirements:
      - dnsx
    commands:
      - cat {{.TempDir}}/subfinder.txt {{.TempDir}}/alterx.txt | dnsx -o {{.TempDir}}/dnsx.txt


post_run:
  - Append("{{.Workspace}}/reports/dns/subdomains.txt", "{{.TempDir}}/subfinder.txt")
  - Append("{{.Workspace}}/reports/dns/subdomains.txt", "{{.TempDir}}/alterx.txt")
  - CopyFile("{{.TempDir}}/dnsx.txt", "{{.Workspace}}/reports/dns/valid_subdomains.txt")