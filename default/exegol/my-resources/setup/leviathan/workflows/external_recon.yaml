name: recon
description: Workflow to emulate reconFTW results
author: y0no
validator: domain

routines:
  - modules:
      - domain_info
      - zonetransfer
      - subdomains
      - leaks_gathering

  - params:
      - targetfile: "{{.Workspace}}/reports/dns/valid_subdomains.txt"
    modules:
      - dns_resolver

  - params:
      - targetfile: "{{.Workspace}}/reports/osint/domain_ips.txt"
    modules:
      - ip_info
