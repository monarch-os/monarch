[General]
# SDDM reads each key below as `config.<key>` inside Main.qml.
#
# This file is REGENERATED by Noctalia's user-template system (registered as
# [templates.sddm] in ~/.config/noctalia/user-templates.toml) on every color
# generation, so the login screen follows the active scheme automatically — no
# rebuild, no manual step. Don't hand-edit; edit the Noctalia scheme instead.
# Made world-writable at install (monarch-refresh-sddm) so Noctalia, running as
# the user, can rewrite it under /usr/share.
#
# Defaults below are the Monarch dark scheme (used before the first regeneration
# and for built-in Noctalia schemes that ship no template colors).
mPrimary=#b471de
mOnPrimary=#1a1b26
mSecondary=#449dab
mOnSecondary=#1a1b26
mTertiary=#ad8ee6
mOnTertiary=#1a1b26
mError=#f7768e
mOnError=#1a1b26
mSurface=#1a1b26
mOnSurface=#a9b1d6
mSurfaceVariant=#3c2a6c
mOnSurfaceVariant=#787c99
mOutline=#444b6a
mShadow=#1a1b26
