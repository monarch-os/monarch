# Monarch's display panel.
#
# Laid out after quattro's omarchy.monitor, minus its brightness slider — and
# that one is absent for a harder reason than taste. Noctalia exposes brightness
# for writing only: `brightness-set` takes a target and a value, and there is no
# `brightness-get` at all. A slider here would have no position to start from
# short of reading sysfs for the internal panel and having nothing for a DDC
# monitor, which is the service the control center's Monitor tab already owns.
# The sun in this panel's header goes there.
#
# What no part of v5 offers is the compositor's side — per-output scale and
# turning a screen off — so that is what this carries, with the text size
# quattro puts in the same panel.
#
# The pill stands where quattro puts omarchy.monitor and where Monarch had the
# stock `brightness` widget — replacing it rather than joining it, so the right
# lane keeps one screen glyph. The scroll-to-dim gesture is re-bound in
# display.luau and the brightness sliders are a button away inside the panel, so
# the swap costs nothing. It also opens from the menu, under Hardware.

id          = "monarch/display"
name        = "Monarch Display"
version     = "1.0.0"
# 22 everywhere in Monarch; this panel needs 13 (capture_keys) at most.
plugin_api  = 22
author      = "monarch"
license     = "MIT"
description = "Per-output scale, on-off and the text size, in one panel."
icon        = "device-desktop"

[[widget]]
id    = "display"
entry = "display.luau"

[[panel]]
id     = "panel"
entry  = "panel.luau"
width  = 420
height = 480
# Drops out of the pill that opens it, the way monarch/network's panel does.
placement = "attached"
position  = "auto"
open_near_click = true
keyboard_focus = "on_demand"
capture_keys   = ["escape"]
dismiss_on_outside_click = true
