# Monarch's display panel.
#
# The half of quattro's omarchy.monitor that Noctalia has nothing for. Its
# brightness slider is not here on purpose: the control center's Monitor tab
# already draws one per display, over a service that speaks both backlight and
# DDC. What no part of v5 offers is the compositor's side — per-output scale and
# turning a screen off — so that is what this carries, with the text size
# quattro puts in the same panel.
#
# The pill stands where quattro puts omarchy.monitor and where Monarch had the
# stock `brightness` widget — replacing it rather than joining it, so the right
# lane keeps one screen glyph. The scroll-to-dim gesture is re-bound in
# display.luau and the brightness sliders are a button away inside the panel, so
# the swap costs nothing. It also opens from the menu, under Hardware.

id          = "monarch/display"
name        = "Monarch Display"
version     = "1.0.0"
# 22 everywhere in Monarch; this panel needs 13 (capture_keys) at most.
plugin_api  = 22
author      = "monarch"
license     = "MIT"
description = "Per-output scale, on-off and the text size, in one panel."
icon        = "device-desktop"

[[widget]]
id    = "display"
entry = "display.luau"

[[panel]]
id     = "panel"
entry  = "panel.luau"
width  = 420
height = 480
# Drops out of the pill that opens it, the way monarch/network's panel does.
placement = "attached"
position  = "auto"
open_near_click = true
keyboard_focus = "on_demand"
capture_keys   = ["escape"]
dismiss_on_outside_click = true
