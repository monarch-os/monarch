# Noctalia user-template — registered as [templates.herdr] in user-templates.toml.
# Noctalia renders this to ~/.config/herdr/config.toml on every color generation,
# so the herdr terminal multiplexer (the tmux replacement) follows the active
# scheme (Monarch, Catppuccin, Nord, …) and dark/light. The post_hook reloads
# the running herdr server so the change is live without a restart.
#
# This is the single source for the herdr config — there is no separate baked
# default. herdr falls back to its built-in defaults for any key we omit, so a
# partial config is valid; we only set the prefix and the theme here.
#
# Theme model: the built-in `terminal` base makes pane *content* follow the
# terminal's palette (already Noctalia-themed via the terminal colorscheme), and
# [theme.custom] maps herdr's own chrome — tab bar, pane borders, agent-status
# highlights — to the Material tokens. herdr accepts hex with a leading '#', so
# we use the {{...hex}} filter (not hex_stripped).

[keys]
# Prefix is herdr's default (ctrl+b); set explicitly for clarity. The default
# prefix-mode actions already mirror the old tmux binds closely: prefix+c new
# tab, prefix+x close pane, prefix+v / prefix+minus split, prefix+n / prefix+p
# next/prev tab, prefix+1..9 select tab, prefix+h/j/k/l focus pane. herdr warns
# against direct (prefix-less) alt/punctuation chords, so we keep the defaults.
prefix = "ctrl+b"

[theme]
name = "terminal"

[theme.custom]
panel_bg = "{{colors.surface_container.default.hex}}"
accent   = "{{colors.primary.default.hex}}"
