# Noctalia user-template — registered as [templates.fuzzel] in user-templates.toml.
# Noctalia renders this to ~/.config/fuzzel/fuzzel.ini on every color generation,
# so the fuzzel dmenu picker used by monarch-menu-* follows the active scheme
# (Monarch, Catppuccin, Nord, …) and dark/light. fuzzel re-reads its config on
# every launch, so no reload hook is needed.
#
# fuzzel wants colors as RRGGBBAA with NO leading '#'. The {{...hex_stripped}}
# filter drops the '#'; we append 'ff' for full opacity (the panel stays opaque
# on purpose — fuzzel can't blur, so translucency over a wallpaper hurts
# legibility).
#
# Colors follow the "accent-filled selection" design: the selected row is filled
# with the accent (primary) and its text is on_primary; the prompt and matched
# substrings are accented too. This mirrors Noctalia's own menus.
#
# This is the single source for the fuzzel config — there is no separate baked
# default. Noctalia auto-applies the active scheme on every session start (with
# templates.enableUserTheming = true) and the template processor creates
# ~/.config/fuzzel/ if missing, so the rendered config always exists in-session
# before any monarch-menu can be invoked. (Unlike sddm, fuzzel never runs outside
# a Noctalia session, so it needs no pre-session bootstrap.)

[main]
font=monospace
dpi-aware=auto
prompt="› "
icons-enabled=no
lines=12
width=34
horizontal-pad=24
vertical-pad=16
inner-pad=12
layer=overlay

[colors]
background={{colors.surface.default.hex_stripped}}ff
text={{colors.on_surface.default.hex_stripped}}ff
prompt={{colors.primary.default.hex_stripped}}ff
placeholder={{colors.outline.default.hex_stripped}}ff
input={{colors.on_surface.default.hex_stripped}}ff
match={{colors.primary.default.hex_stripped}}ff
selection={{colors.primary.default.hex_stripped}}ff
selection-text={{colors.on_primary.default.hex_stripped}}ff
selection-match={{colors.on_primary.default.hex_stripped}}ff
counter={{colors.outline.default.hex_stripped}}ff
border={{colors.primary.default.hex_stripped}}ff
message={{colors.on_surface_variant.default.hex_stripped}}ff

[border]
width=2
radius=12
