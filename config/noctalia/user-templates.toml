# Noctalia user-templates registry (requires templates.enableUserTheming = true).
# Inputs live under ~/.config/noctalia/templates/ so they survive monarch-nvim-setup
# rewriting ~/.config/nvim. Noctalia re-renders these on every color generation.
# (The sddm output is a system path under /usr/share, made world-writable at
# install so Noctalia can rewrite it — see monarch-refresh-sddm.)

[templates.nvim-base16]
input_path = "~/.config/noctalia/templates/nvim-base16.lua"
output_path = "~/.config/nvim/lua/matugen.lua"
post_hook = "pkill -SIGUSR1 nvim"

[templates.obsidian]
input_path = "~/.config/noctalia/templates/obsidian.css"
output_path = "~/.config/monarch/obsidian/theme.css"
post_hook = "monarch-obsidian-theme"

[templates.sddm]
input_path = "~/.config/noctalia/templates/sddm.conf"
output_path = "/usr/share/sddm/themes/monarch/theme.conf"
post_hook = "monarch-sddm-theme"

# fuzzel dmenu picker (monarch-menu-*). The template carries layout + colors;
# Noctalia creates ~/.config/fuzzel/ if missing and re-renders on every session
# start, so no baked default is shipped. No post_hook: fuzzel re-reads its config
# on every launch.
[templates.fuzzel]
input_path = "~/.config/noctalia/templates/fuzzel.ini"
output_path = "~/.config/fuzzel/fuzzel.ini"

# herdr terminal multiplexer (the tmux replacement, launched via Mod+Shift+Return
# and the t alias). The template carries the prefix + theme; Noctalia creates
# ~/.config/herdr/ if missing and re-renders on every color generation. The
# post_hook reloads the running server so the scheme applies live (no-op when
# herdr is not running).
[templates.herdr]
input_path = "~/.config/noctalia/templates/herdr.toml"
output_path = "~/.config/herdr/config.toml"
post_hook = "herdr server reload-config 2>/dev/null || true"

# Zed editor. The template is the full Zed theme JSON (4 variants: Noctalia
# Dark/Light + transparent), rendered from Noctalia's Material 3 tokens —
# adapted verbatim from the upstream noctalia-dev/community-templates "zed"
# entry so it stays drop-in updatable. Noctalia re-renders on every color
# generation; Zed watches its themes/ dir and hot-reloads, so no post_hook is
# needed. Both dark and light blocks are always populated, so Zed's
# "theme": { "mode": "system", … } follows Noctalia's dark/light toggle on its
# own (set by monarch-install-zed). Registered for every install (like
# nvim/obsidian); the rendered output is harmless when Zed is absent. This
# replaces the old standalone `monzed` package (the pre-Niri Zed theme bridge).
[templates.zed]
input_path = "~/.config/noctalia/templates/zed.json"
output_path = "~/.config/zed/themes/noctalia.json"
