# Monarch hyprlock configuration.
#
# Hyprlock is wlroots-compatible (ext-session-lock-v1) and runs under Niri
# without pulling Hyprland in. We use it for the input-field UX that
# swaylock cannot provide (rectangular password box).
#
# Reference: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

# Themed colours generated by monarch-theme-set.
source = ~/.config/monarch/current/theme/hyprlock.conf

general {
    ignore_empty_input = true
}

background {
    monitor =
    color = $color
    path = ~/.config/monarch/current/background
    blur_passes = 3
}

animations {
    enabled = false
}

input-field {
    monitor =
    size = 650, 100
    position = 0, 0
    halign = center
    valign = center

    inner_color = $inner_color
    outer_color = $outer_color
    outline_thickness = 4

    font_family = JetBrainsMono Nerd Font
    font_color = $font_color

    placeholder_text = Enter Password
    check_color = $check_color
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = 0
    shadow_passes = 0
    fade_on_empty = false
}

# Fingerprint auth is handled by PAM (pam_fprintd.so) on the lock-screen
# stack; hyprlock's built-in fingerprint UI stays disabled.
auth {
    fingerprint:enabled = false
}
