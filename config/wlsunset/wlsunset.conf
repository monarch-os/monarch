# Monarch wlsunset configuration (replaces hyprsunset).
# wlsunset is invoked by monarch-toggle-nightlight; it does not read this file
# directly, but the values below are the defaults the script uses.
#
# Lines are simple KEY=VALUE pairs sourced by bash.

# Latitude / longitude (rough Paris); override per machine.
LATITUDE=48.8
LONGITUDE=2.3

# Day / night colour temperatures (kelvin).
DAY_TEMP=6500
NIGHT_TEMP=4000

# Gamma multiplier applied at night (1.0 = no adjustment).
GAMMA=1.0
