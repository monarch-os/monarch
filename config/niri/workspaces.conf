# Monarch — persistent workspace names.
#
# One name per line, top to bottom = workspaces 1..10:
#   line 1 -> Mod+1 / Mod+Shift+1
#   line 2 -> Mod+2 / Mod+Shift+2
#   ...
#   line 10 -> Mod+0 / Mod+Shift+0
#
# The name is what the Noctalia bar shows (Workspace widget, labelMode "name")
# AND the target niri binds focus/move to — they are generated together into
# ~/.config/niri/workspaces.kdl, so they can never drift apart. After editing
# this file, run:  monarch refresh niri
#
# Notes:
#   - Blank lines and lines starting with '#' are ignored.
#   - Anything past the first 10 names is ignored; fewer than 10 is fine (the
#     unused Mod+N binds simply aren't generated).
#   - Names may be plain numbers, words, Nerd Font glyphs, or emoji. The bar
#     hides empty workspaces (hideUnoccupied), so labels show as you visit them.
#
# Example (Nerd Font glyphs, like the old waybar format-icons map):
#   󰂓
#   󰭹
#   󰝚

