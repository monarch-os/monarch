# Learn how to configure Hyprland: https://wiki.hyprland.org/Configuring/

# Use defaults Monarch defaults (but don't edit these directly!)
source = ~/.local/share/monarch/default/hypr/autostart.conf
source = ~/.local/share/monarch/default/hypr/bindings/grouping.conf
source = ~/.local/share/monarch/default/hypr/bindings/media.conf
source = ~/.local/share/monarch/default/hypr/bindings/tiling.conf
source = ~/.local/share/monarch/default/hypr/bindings/clipboard.conf
source = ~/.local/share/monarch/default/hypr/bindings/utilities.conf
source = ~/.local/share/monarch/default/hypr/envs.conf
source = ~/.local/share/monarch/default/hypr/looknfeel.conf
source = ~/.local/share/monarch/default/hypr/input.conf
source = ~/.local/share/monarch/default/hypr/windows.conf
source = ~/.config/monarch/current/theme/hyprland.conf

# Change your own setup in these files (and overwrite any settings from defaults!)
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/bindings.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/autostart.conf

# Toggle config flags dynamically
source = ~/.local/state/monarch/toggles/hypr/*.conf
