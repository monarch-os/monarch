name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run deterministic integration suite
        run: test/run integration

  repository-tests:
    name: Repository availability tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Pacman and PyPI package availability
        run: test/run focused test/monarch-packages-exist-test.sh

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint bin/ scripts
        # zsh scripts are skipped: shellcheck only supports sh/bash/dash/ksh.
        run: |
          grep -rlE '^#!/(usr/)?bin/(env +)?(ba)?sh\b' bin/ \
            | xargs shellcheck --severity=error

      - name: Lint install scripts and migrations
        # Sourced scripts: no shebang, so the shell must be forced.
        run: |
          find install migrations -name '*.sh' \
            | xargs shellcheck --shell=bash --severity=error

      - name: Lint test runner
        run: shellcheck --severity=error test/run
