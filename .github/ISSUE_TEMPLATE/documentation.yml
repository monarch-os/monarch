name: Documentation
description: Report missing, incorrect, or unclear documentation.
labels: [documentation]
body:
  - type: textarea
    id: location
    attributes:
      label: Documentation location
      description: Provide the GitBook URL or docs/ file path. Write "New page" if none exists.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or missing information
      description: What is incorrect, unclear, or missing?
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: Suggested improvement
      description: What should be explained or corrected?
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include the relevant Monarch version, examples, or screenshots.
