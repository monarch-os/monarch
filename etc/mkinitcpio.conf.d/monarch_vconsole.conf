# Plymouth also copies this file itself; FILES alone cannot exclude a non-Latin
# primary layout. Keep explicit FILES entries and legacy Latin layouts working.
if [[ -f /etc/vconsole.conf ]] && declare -F add_file >/dev/null && ! declare -F _monarch_add_file >/dev/null; then
  eval "_monarch_$(declare -f add_file)"
  _monarch_vconsole_nonlatin() {
    local layout
    layout=$(unset XKBLAYOUT; . /etc/vconsole.conf 2>/dev/null && printf '%s' "${XKBLAYOUT:-}") || return 1
    case ${layout%%,*} in
      af | am | ara | bd | bg | by | et | ge | gr | il | in | iq | ir | kg | kh | kz | la | lk | mk | mm | mn | mv | np | rs | ru | sy | th | tj | ua) return 0 ;;
    esac
    return 1
  }
  add_file() {
    if [[ ${2:-$1} == "/etc/vconsole.conf" && " ${FILES[*]:-} " != *" /etc/vconsole.conf "* ]] && _monarch_vconsole_nonlatin; then
      return 0
    fi
    _monarch_add_file "$@"
  }
fi
